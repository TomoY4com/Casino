<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASINO</title>
<link rel="stylesheet" href="assets/common.css">
<style>
.games{display:grid;gap:12px}
.game{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.game b{display:block;font-size:18px;margin-bottom:4px}.game span{color:var(--sub);font-size:13px}
.game:hover{border-color:var(--gold)}
</style>
</head>
<body>
<main>
<nav class="nav"><a href="index.html" class="on">トップ</a><a href="sicbo.html">🎲 シックボー</a><a href="blackjack.html">🃏 ブラックジャック</a></nav>
<h1>🎰 Casino</h1>
<p class="sub">シークレットモードは非推奨です（コインが保存されません）</p>
<div class="card top" style="grid-template-columns:repeat(3,1fr)">
  <div class="stat"><b id="bal">1000</b><span>所持チップ</span></div>
  <div class="stat"><b id="net">0</b><span>通算損益</span></div>
  <div class="stat"><b id="rnd">0</b><span>ラウンド数</span></div>
</div>
<div class="games">
  <a class="game" href="sicbo.html"><b>🎲 Sicbo</b><span>３つのサイコロの大小・合計・ゾロ目の賭けゲーム。</span></a>
  <a class="game" href="blackjack.html"><b>🃏 Black Jack</b><span>ディーラー対プレイヤー。</span></a>
</div>
<div class="btns"><button class="b" id="reset">チップをリセット</button></div>
</main>
<script src="assets/wallet.js"></script>
<script>
const $=id=>document.getElementById(id);
function paint(){
  const s=Wallet.get();$("bal").textContent=s.balance;
  const n=$("net");n.textContent=(s.net>0?"+":"")+s.net;n.className=s.net>0?"pos":s.net<0?"neg":"";
  $("rnd").textContent=s.rounds;
}
paint();Wallet.on(paint);
$("reset").onclick=()=>{if(confirm("チップを"+Wallet.START+"枚に戻します。よろしいですか?")){Wallet.reset();paint()}};
</script>
</body>
</html>
